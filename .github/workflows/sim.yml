name: simulator-screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  sim:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project Xinghai.xcodeproj -scheme Xinghai \
            -configuration Debug -sdk iphonesimulator -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -5

      - name: Boot simulator, install app, take screenshots
        run: |
          set -x
          # 选第一台可用 iPhone 模拟器
          DEV=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          echo "device=$DEV"
          xcrun simctl bootstatus "$DEV" -b
          APP="dd/Build/Products/Debug-iphonesimulator/Xinghai.app"
          xcrun simctl install "$DEV" "$APP"
          mkdir -p shots
          for T in 0 1 2; do
            xcrun simctl terminate "$DEV" com.xinghai.musicpub || true
            xcrun simctl launch "$DEV" com.xinghai.musicpub -tab $T
            sleep 14   # 等云端数据加载
            xcrun simctl io "$DEV" screenshot shots/tab$T.png
          done
          # 早课行验收：定位到有早于第一节课的成员（崔峻嘉 周三 器乐与合奏 08:15-08:55）
          xcrun simctl terminate "$DEV" com.xinghai.musicpub || true
          xcrun simctl launch "$DEV" com.xinghai.musicpub -tab 0 -person 崔峻嘉
          sleep 16
          xcrun simctl io "$DEV" screenshot shots/early_row.png
          # 回桌面截图：验证 App 图标是否正常显示
          xcrun simctl terminate "$DEV" com.xinghai.musicpub || true
          sleep 4
          xcrun simctl io "$DEV" screenshot shots/home.png
          xcrun simctl shutdown "$DEV" || true

      - name: Verify app icon is compiled into the bundle
        run: |
          APP="dd/Build/Products/Debug-iphonesimulator/Xinghai.app"
          echo "--- Info.plist 图标键 ---"
          plutil -p "$APP/Info.plist" | grep -i -E "CFBundleIcon" || echo "!! 缺少 CFBundleIcons"
          echo "--- 包内图标资源 ---"
          ls -la "$APP" | grep -i -E "Assets.car|Icon" || echo "!! 未找到 Assets.car"
          echo "--- 编译出的图标 rendition ---"
          xcrun assetutil --info "$APP/Assets.car" 2>/dev/null \
            | grep -i -E '"Name" *: *"AppIcon' | sort -u | head -20 \
            || echo "(assetutil 不可用)"

      - name: Zip simulator app (Appetize.io 需要的格式)
        run: |
          cd dd/Build/Products/Debug-iphonesimulator
          mkdir -p ../../../../out
          zip -r -y ../../../../out/Xinghai-simulator.zip Xinghai.app
          unzip -l ../../../../out/Xinghai-simulator.zip | head -5
          ls -la ../../../../out/

      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: shots/

      - uses: actions/upload-artifact@v4
        with:
          name: Xinghai-simulator-app
          path: out/Xinghai-simulator.zip
